name: newapi.ai 自动签到

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: '调试模式'
        required: false
        type: boolean
        default: false

concurrency:
  group: newapi-checkin
  cancel-in-progress: false

jobs:
  checkin:
    permissions:
      id-token: write
      contents: read
    runs-on: windows-2025
    environment: production
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      TZ: Asia/Shanghai
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.1'

      - name: 安装 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: 缓存 UV 依赖
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: uv-cache
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: 安装依赖
        if: steps.uv-cache.outputs.cache-hit != 'true'
        run: uv sync --frozen

      - name: 获取 Camoufox 版本
        id: camoufox-version
        run: |
          $version = uv run python -c "import importlib.metadata; print(importlib.metadata.version('camoufox'))"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: 缓存 Camoufox 浏览器
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: camoufox-cache
        with:
          path: ~\AppData\Local\camoufox
          key: ${{ runner.os }}-camoufox-${{ steps.camoufox-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-camoufox-

      - name: 安装 Camoufox 浏览器
        if: steps.camoufox-cache.outputs.cache-hit != 'true'
        run: uv run camoufox fetch

      - name: 恢复登录状态缓存
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: storage-states
          key: storage-state-${{ hashFiles('storage-states/*.json') }}
          restore-keys: |
            storage-state-

      - name: 恢复余额历史缓存
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: balance_hash.txt
          key: balance-hash-${{ hashFiles('balance_hash.txt') }}
          restore-keys: |
            balance-hash-

      - name: 执行签到
        env:
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
          ACCOUNTS_LINUX_DO: ${{ secrets.ACCOUNTS_LINUX_DO }}
          ACCOUNTS_GITHUB: ${{ secrets.ACCOUNTS_GITHUB }}
          PROVIDERS: ${{ secrets.PROVIDERS }}
          REQUIRED_PROVIDERS: anyrouter,huan666,x666
          AUTO_ADD_REQUIRED_PROVIDERS: anyrouter
          PROXY: ${{ secrets.PROXY }}
          STORATE_STATES_GITHUB: ${{ secrets.STORATE_STATES_GITHUB }}
          STORATE_STATES_LINUXDO: ${{ secrets.STORATE_STATES_LINUXDO }}
          DEBUG: ${{ github.event_name == 'workflow_dispatch' && inputs.debug || vars.DEBUG || 'false' }}
          DINGDING_WEBHOOK: ${{ secrets.DINGDING_WEBHOOK }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          CUSTOM_SMTP_SERVER: ${{ secrets.CUSTOM_SMTP_SERVER }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERPUSHKEY: ${{ secrets.SERVERPUSHKEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WEIXIN_WEBHOOK: ${{ secrets.WEIXIN_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run python -u main.py

      - name: 保存登录状态缓存
        if: always() && hashFiles('storage-states/*.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: storage-states
          key: storage-state-${{ hashFiles('storage-states/*.json') }}

      - name: 保存余额历史缓存
        if: always() && hashFiles('balance_hash.txt') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: balance_hash.txt
          key: balance-hash-${{ hashFiles('balance_hash.txt') }}

      - name: 保存脱敏结果
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checkin-result-${{ github.run_number }}
          path: checkin-result.json
          if-no-files-found: warn
          retention-days: 7
