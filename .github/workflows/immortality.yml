name: GitHub Workflow Immortality

on:
  schedule:
    - cron: '20 0 1 * *'
  workflow_dispatch: {}

jobs:
  keepalive:
    name: GitHub Workflow Immortality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: 检查并启用定时工作流
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in checkin.yml immortality.yml; do
            state="$(gh api "repos/${GH_REPO}/actions/workflows/${workflow}" --jq '.state')"
            if [[ "${state}" != "active" ]]; then
              gh api --method PUT "repos/${GH_REPO}/actions/workflows/${workflow}/enable"
            fi
            final_state="$(gh api "repos/${GH_REPO}/actions/workflows/${workflow}" --jq '.state')"
            test "${final_state}" = "active"
            echo "- ${workflow}: ${final_state}" >> "${GITHUB_STEP_SUMMARY}"
          done
